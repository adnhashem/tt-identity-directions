<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>طلبات العروض — إدارة Think Tank</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tt.css">
<style>
[tabindex="-1"]:focus{outline:0}
.tabs{margin-bottom:var(--s-16)}
.tabs [role=tab] i{font-style:normal;font-size:var(--fs-12);font-variant-numeric:tabular-nums;margin-inline-start:var(--s-4);opacity:.75}
.count{margin:0 0 var(--s-8);font-size:var(--fs-14);color:var(--ink-2)}
.count b{color:var(--ink);font-variant-numeric:tabular-nums}
.led td{padding-block:var(--s-12)}
.led small{display:block;font-size:var(--fs-13);color:var(--ink-2);line-height:1.6}
.led .ref bdi{font-weight:700;font-variant-numeric:tabular-nums}
.led .when{white-space:nowrap}
.led td:last-child{text-align:end}
.led .m{display:none}
.led tr.open>td{border-bottom-color:transparent}
.led tr.det>td{padding:0 6px var(--s-32)}
/* the opened request: what they asked beside what you answer */
.det .in{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:var(--s-24) var(--s-48);align-items:start}
.det h2.dh{font-size:var(--fs-13);font-weight:500;color:var(--ink-2);padding-bottom:var(--s-4);border-bottom:1px solid var(--ink)}
.det .dl>div{grid-template-columns:minmax(96px,150px) minmax(0,1fr);padding:var(--s-8) 0;border-bottom:1px solid var(--card-edge);font-size:var(--fs-14)}
.det .dl dd.big{font-size:var(--fs-18);font-weight:700;font-variant-numeric:tabular-nums}
.det .say{margin:var(--s-16) 0 0;font-size:var(--fs-14);color:var(--ink-2);max-width:56ch}
.det .say b{color:var(--ink)}
.det .go{margin-top:var(--s-16)}
.det .notice{margin-top:var(--s-16)}
.qf{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s-16);align-items:start;margin-top:var(--s-16)}
.qf .w2{grid-column:1/-1}
.qf .field.bad input{border-color:var(--err)}
.tail{margin-top:var(--s-24)}
@media (max-width:900px){
  .led .x{display:none}.led .m{display:block}
  .det .in{grid-template-columns:minmax(0,1fr)}
  .qf{grid-template-columns:minmax(0,1fr)}
  .det .dl>div{grid-template-columns:minmax(0,1fr);gap:0}
}
</style>
</head>
<body class="desk">
<div class="shell">
  <nav class="side" aria-label="الإدارة">
    <div class="brand"><img src="assets/logo-white.png" alt="Think Tank Strategists"><span>الإدارة</span></div>
    <a href="09-admin-inbox.html">ما ينتظرك <span class="n">3</span></a>
    <a href="24-admin-cohorts.html">الدفعات</a>

    <a href="27-admin-proposals.html" aria-current="page">طلبات العروض <span class="n">2</span></a>
    <a href="28-admin-payments.html">المدفوعات <span class="n">1</span></a>
    <a href="29-admin-certificates.html">الشهادات</a>
    <a href="30-admin-trainees.html">المتدربون</a>
    <a href="31-admin-report.html">التقرير الشامل</a>
    <div class="foot">د. منال الحساوي<br><a href="index.html">خريطة الشاشات</a><br><a href="17-login.html">خروج</a></div>
  </nav>

  <main class="work">
    <div class="sheet">
      <header class="top">
        <div><h1>طلبات العروض</h1><div class="crumb" id="crumb"></div></div>
      </header>

      <section aria-label="طلبات الجهات لبرامج مغلقة">
        <div class="tabs scroll-x" role="tablist" aria-label="تصفية بالحالة" id="tabs"></div>
        <p class="count" id="count" role="status"></p>
        <div class="scroll-x" id="panel" role="tabpanel" aria-label="الطلبات">
          <table class="t led">
            <thead><tr><th>الطلب</th><th class="x">الجهة</th><th class="x">البرنامج</th><th class="x">المشاركون</th><th class="x">وصل في</th><th>الحالة</th><th><span class="vh">فتح الطلب</span></th></tr></thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
        <div class="empty" id="empty" hidden>
          <h2 id="emh"></h2><p id="emp"></p>
          <p><button class="lbtn" type="button" id="clear">اعرضي كل الطلبات</button></p>
        </div>
        <p class="synthetic tail">الجهات والأسماء والأسعار تجريبية، واليوم في العرض 6 ديسمبر 2026. <a href="index.html">خريطة الشاشات</a></p>
      </section>
    </div>
  </main>
</div>
<script src="tt.js"></script>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const MON=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
const pl=(n,one,two,few,many)=>n===1?one:n===2?two:n>=3&&n<=10?`${n} ${few}`:`${n} ${many}`;
const money=n=>n.toLocaleString('en-US',{minimumFractionDigits:3,maximumFractionDigits:3})+' د.ك';
const pt=iso=>{const [y,m,d]=iso.split('-').map(Number);return {y,m,d}};
const date=iso=>{const {y,m,d}=pt(iso);return `${d} ${MON[m-1]} ${y}`};
const range=(a,b)=>{if(!a&&!b)return 'لم تُحدَّد';if(!b||a===b)return date(a);if(!a)return date(b);const x=pt(a),y=pt(b);
  return x.y===y.y&&x.m===y.m?`${x.d} – ${y.d} ${MON[y.m-1]} ${y.y}`:`${x.d} ${MON[x.m-1]} – ${date(b)}`};
const people=n=>pl(n,'مشارك واحد','مشاركان','مشاركين','مشاركاً');

// the lifecycle runs on these keys; the Arabic words are display only
const ST={new:['you','جديد · ينتظرك'],review:['you','قيد المراجعة'],priced:['wait','مُسعَّر'],accepted:['you','مقبول'],rejected:['off','مرفوض']};
const TAB={new:'جديد',review:'قيد المراجعة',priced:'مُسعَّر',accepted:'مقبول',rejected:'مرفوض'};
const ORDER=['new','review','priced','accepted','rejected'];
const EMPTY={new:['لا طلبات جديدة','كل ما وصلك بدأتِ مراجعته. الطلب الجديد يظهر هنا فور إرساله.'],review:['لا طلبات قيد المراجعة','لا عرض ينتظر أن تسعّريه.'],
  priced:['لا عروض عند الجهات','لا عرض مُرسل ينتظر رداً.'],accepted:['لا عروض مقبولة','حين تقبل جهة عرضاً يظهر هنا لتنشئي دفعتها.'],rejected:['لا عروض مرفوضة','لم ترفض أي جهة عرضاً.']};
const Q=[
 {ref:'Q-2026-014',org:'هيئة النموذج',who:'ناصر العلي',prog:'استشراف المستقبل',n:25,got:'2026-12-03',s:'new',
  want:'فبراير 2027، ثلاثة أيام متتالية',where:'مقر الهيئة',lang:'العربية',note:'نريد أن يكون التطبيق على خطة الهيئة 2030. المشاركون مديرو إدارات.'},
 {ref:'Q-2026-011',org:'بنك المثال',who:'منى السالم',f:1,prog:'ورش الاستراتيجية للقيادات التنفيذية',n:20,got:'2026-11-24',s:'priced',
  want:'يناير 2027، يومان',where:'قاعة الشركة',lang:'الإنجليزية',note:'المشاركون من الإدارة التنفيذية وبعضهم لا يقرأ العربية.',
  quote:{price:4200,from:'2027-01-25',to:'2027-01-26',valid:'2026-12-20',note:'السعر يشمل المواد المطبوعة وشهادات المشاركين.',sent:'2026-11-30'}},
 {ref:'Q-2026-009',org:'وزارة التخطيط',who:'أمل الرشيد',f:1,prog:'استشراف المستقبل',n:18,got:'2026-11-12',s:'accepted',
  want:'يناير 2027، ثلاثة أيام',where:'مقر الوزارة',lang:'العربية',note:'نفضّل الفترة الصباحية.',
  quote:{price:3600,from:'2027-01-18',to:'2027-01-20',valid:'2026-12-10',note:'ثلاث جلسات صباحية في مقر الوزارة.',sent:'2026-11-19'},answered:'2026-12-01'},
 {ref:'Q-2026-007',org:'شركة النموذج القابضة',who:'فيصل الدوسري',prog:'بناء القيادات والقدرات المؤسسية',n:30,got:'2026-11-18',s:'review',since:'2026-11-20',
  want:'مارس 2027، خمس جلسات أسبوعية',where:'مقر الشركة',lang:'العربية',note:'المشاركون مديرو الصف الثاني في الشركات التابعة.'},
 {ref:'Q-2026-003',org:'مؤسسة المثال الخيرية',who:'هدى المنصور',f:1,prog:'بناء القيادات والقدرات المؤسسية',n:12,got:'2026-08-24',s:'rejected',
  want:'أكتوبر 2026',where:'قاعة الشركة',lang:'العربية',note:'فريق صغير من مديري البرامج.',
  quote:{price:2400,from:'2026-10-19',to:'2026-10-23',valid:'2026-09-15',note:'خمس جلسات مسائية.',sent:'2026-08-31'},answered:'2026-09-09',why:'الميزانية المعتمدة لهذا العام لا تكفي.'}];
Q.forEach(q=>{q.draft={price:'',from:'',to:'',valid:'',note:''}});
let filter='all',open='Q-2026-014',fresh='',err=null,making=false,said='';
const mine=q=>q.s==='new'||q.s==='review'||(q.s==='accepted'&&!q.cohort);

function head(){
  const n=Q.filter(mine).length;
  $('crumb').textContent=`${pl(Q.length,'طلب واحد','طلبان','طلبات','طلباً')} · ${n===0?'لا شيء ينتظرك':n===1?'واحد ينتظرك':n===2?'اثنان ينتظرانك':n+' تنتظرك'}`;
  const tab=(k,label,c)=>`<button role="tab" type="button" aria-selected="${filter===k}" aria-controls="panel" data-k="${k}"${filter===k?'':' tabindex="-1"'}>${label}<i>${c}</i></button>`;
  $('tabs').innerHTML=tab('all','الكل',Q.length)+ORDER.map(k=>tab(k,TAB[k],Q.filter(q=>q.s===k).length)).join('');
}
const stampOf=q=>{const [c,w]=q.cohort?['ok','دفعة أُنشئت']:ST[q.s];return `<span class="stamp ${c}${fresh===q.ref?' press':''}"><span class="vh">حالة الطلب: </span>${w}</span>`};
const asked=q=>`<div><h2 class="dh">ما طلبته الجهة</h2><dl class="dl">
  <div><dt>مسؤول التدريب</dt><dd>${q.who} · ${q.org}</dd></div>
  <div><dt>البرنامج</dt><dd>${q.prog}، مغلقاً لموظفيها</dd></div>
  <div><dt>عدد المشاركين</dt><dd class="num">${people(q.n)}</dd></div>
  <div><dt>الموعد المفضّل</dt><dd>${q.want}</dd></div>
  <div><dt>المكان</dt><dd>${q.where}</dd></div>
  <div><dt>لغة التقديم</dt><dd>${q.lang}</dd></div>
  <div><dt>ما كتبوه</dt><dd>«${q.note}»</dd></div></dl></div>`;
const quoted=q=>`<dl class="dl">
  <div><dt>السعر المتفق عليه</dt><dd class="big">${money(q.quote.price)}</dd></div>
  <div><dt>المواعيد المقترحة</dt><dd>${range(q.quote.from,q.quote.to)}</dd></div>
  <div><dt>العرض صالح حتى</dt><dd>${q.quote.valid?date(q.quote.valid):'بلا تاريخ انتهاء'}</dd></div>
  ${q.quote.note?`<div><dt>ملاحظتك للجهة</dt><dd>${esc(q.quote.note)}</dd></div>`:''}</dl>`;
const note=()=>said?`<div class="notice" role="status" tabindex="-1" id="said"><div>${said}</div></div>`:'';

function answer(q){
  const d=q.draft,bad=k=>err&&err[k]?' bad':'',msg=k=>err&&err[k]?`<span class="msg">${err[k]}</span>`:'';
  if(q.s==='new')return `<div><h2 class="dh">ما تفعلينه الآن</h2>
    <p class="say">الطلب لم يُفتح بعد. ببدء المراجعة تعرف ${q.org} أن طلبها بين يديك، ثم تكتبين السعر والمواعيد.</p>
    <p class="go"><button class="btn" type="button" data-cta="WF-CTA-022" data-act="review">بدء المراجعة</button></p></div>`;
  if(q.s==='review')return `<div><h2 class="dh">عرضك لـ${q.org}</h2>${note()}
    <div class="qf">
      <div class="field w2${bad('price')}"><label for="q-price">السعر المتفق عليه (د.ك)</label><input id="q-price" data-k="price" type="number" min="0" step="0.001" inputmode="decimal" value="${esc(d.price)}" aria-describedby="h-price"><span class="hint" id="h-price">سعر واحد للدفعة كلها (${people(q.n)})، لا للمقعد.</span>${msg('price')}</div>
      <div class="field${bad('from')}"><label for="q-from">الموعد المقترح: من</label><input id="q-from" data-k="from" type="date" min="2026-12-07" value="${d.from}">${msg('from')}</div>
      <div class="field${bad('to')}"><label for="q-to">إلى</label><input id="q-to" data-k="to" type="date" min="2026-12-07" value="${d.to}">${msg('to')}</div>
      <div class="field w2"><label for="q-valid">العرض صالح حتى</label><input id="q-valid" data-k="valid" type="date" min="2026-12-07" value="${d.valid}"></div>
      <div class="field w2"><label for="q-note">ملاحظة للجهة</label><textarea id="q-note" data-k="note" placeholder="ما يشمله السعر، أو شرط للموعد">${esc(d.note)}</textarea></div>
    </div>
    <p class="go"><button class="btn" type="button" data-cta="WF-CTA-023" data-act="send">إرسال العرض</button></p></div>`;
  if(q.s==='priced')return `<div><h2 class="dh">العرض المُرسل</h2>${quoted(q)}${note()}
    <p class="say"><b>العرض عند ${q.org} منذ ${date(q.quote.sent)}.</b> لا شيء مطلوب منك الآن. حين يقبله ${q.f?'مسؤولة':'مسؤول'} التدريب أو يرفضه يتغيّر الطلب هنا ويصلك تنبيه.</p></div>`;
  if(q.s==='accepted'&&q.cohort)return `<div><h2 class="dh">العرض المقبول</h2>${quoted(q)}${note()}
    <p class="say"><b>دفعة هذا الطلب:</b> <a class="link" href="10-admin-cohort.html" id="made">${range(q.cohort.from,q.cohort.to)} · ${q.cohort.cap} مقعداً، مغلقة لـ${q.org}</a>. الطلب الواحد تُنشأ له دفعة واحدة.</p></div>`;
  if(q.s==='accepted')return `<div><h2 class="dh">العرض المقبول</h2>${quoted(q)}
    <p class="say"><b>قبلت ${q.org} العرض في ${date(q.answered)}.</b> بقي أن تنشئي دفعتها المغلقة ليصلها رابط الدفع.</p>
    ${making?`<div class="qf">
      <div class="field${bad('from')}"><label for="c-from">تاريخ البداية</label><input id="c-from" data-c="from" type="date" min="2026-12-07" value="${q.mk.from}">${msg('from')}</div>
      <div class="field${bad('to')}"><label for="c-to">تاريخ النهاية</label><input id="c-to" data-c="to" type="date" min="2026-12-07" value="${q.mk.to}">${msg('to')}</div>
      <div class="field w2${bad('cap')}"><label for="c-cap">السعة (مقعداً)</label><input id="c-cap" data-c="cap" type="number" min="1" step="1" inputmode="numeric" value="${esc(q.mk.cap)}" aria-describedby="h-cap"><span class="hint" id="h-cap">تساوي عدد المشاركين في الطلب: ${q.n}.</span>${msg('cap')}</div>
    </div>
    <p class="go row"><button class="btn" type="button" data-act="save">حفظ الدفعة</button><button class="btn quiet" type="button" data-act="nomake">تراجع</button></p>`
    :`<p class="go"><button class="btn" type="button" data-cta="WF-CTA-026" data-act="make">إنشاء دفعة مغلقة</button></p>`}</div>`;
  return `<div><h2 class="dh">العرض الذي رُفض</h2>${quoted(q)}
    <p class="say"><b>رفضت ${q.org} العرض في ${date(q.answered)}.</b> كتبوا: «${q.why}»</p>
    <p class="say">الطلب مغلق نهائياً. إن أرادت الجهة برنامجاً آخر ترسل طلباً جديداً.</p></div>`;
}

function rows(){
  const list=Q.filter(q=>filter==='all'||q.s===filter);
  $('rows').innerHTML=list.map(q=>{
    const on=open===q.ref;
    return `<tr${on?' class="open"':''} id="r-${q.ref}">
      <td class="ref"><bdi>${q.ref}</bdi><small class="m">${q.org} · ${people(q.n)}</small></td>
      <td class="x">${q.org}</td><td class="x">${q.prog}</td><td class="x num">${q.n}</td><td class="x when">${date(q.got)}</td>
      <td>${stampOf(q)}</td>
      <td><button class="rowlink" type="button" data-open="${q.ref}" aria-expanded="${on}"${on?` aria-controls="d-${q.ref}"`:''} aria-label="${on?'إغلاق':'افتحي'} الطلب ${q.ref}، ${q.org}">${on?'إغلاق':'افتحي'}</button></td></tr>`
      +(on?`<tr class="det" id="d-${q.ref}"><td colspan="7"><div class="in">${asked(q)}${answer(q)}</div></td></tr>`:'');}).join('');
  const none=!list.length;$('panel').hidden=none;$('empty').hidden=!none;
  if(none){[$('emh').textContent,$('emp').textContent]=EMPTY[filter]}
  $('count').innerHTML=list.length===Q.length?`<b>${Q.length}</b> طلبات، الأحدث أولاً`:`تظهر <b>${list.length}</b> من <b>${Q.length}</b>`;
  fresh='';
}
const render=()=>{head();rows()};
const cur=()=>Q.find(q=>q.ref===open);

$('tabs').addEventListener('click',e=>{const t=e.target.closest('[role=tab]');if(!t)return;filter=t.dataset.k;
  if(open&&filter!=='all'&&cur().s!==filter){open=null;making=false;err=null;said=''}
  render();$('tabs').querySelector('[aria-selected=true]').focus()});
$('tabs').addEventListener('keydown',e=>{
  if(e.key!=='ArrowLeft'&&e.key!=='ArrowRight')return;
  const all=[...$('tabs').children],i=all.findIndex(t=>t.getAttribute('aria-selected')==='true');
  e.preventDefault();all[(i+(e.key==='ArrowLeft'?1:-1)+all.length)%all.length].click()});
$('clear').addEventListener('click',()=>{filter='all';render();$('tabs').firstElementChild.focus()});
document.addEventListener('input',e=>{const d=e.target.dataset,q=open&&cur();if(!q)return;
  if(d.k)q.draft[d.k]=e.target.value;else if(d.c)q.mk[d.c]=e.target.value});

document.addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t)return;const d=t.dataset;
  if(d.open){open=open===d.open?null:d.open;making=false;err=null;said='';rows();document.querySelector(`[data-open="${d.open}"]`).focus();return}
  if(!d.act)return;const q=cur();
  if(d.act==='review'){
    q.s='review';q.since='2026-12-06';fresh=q.ref;filter='all';
    said=`<b>بدأت المراجعة.</b> أُبلغ ${q.who} أن الطلب بين يديك. اكتبي السعر والمواعيد ثم أرسلي العرض.`;
    render();$('q-price').focus();ttToast('بدأت مراجعة الطلب');
  }
  else if(d.act==='send'){
    const p=q.draft.price.trim(),x=q.draft;err={};
    if(!p)err.price='اكتبي السعر بالدينار. العرض بلا سعر لا يُرسل.';
    else if(!(+p>0))err.price='السعر يجب أن يكون أكبر من صفر. البرنامج المغلق يُسعَّر دائماً.';
    if(x.from&&x.to&&x.to<x.from)err.to='نهاية الموعد قبل بدايته. اختاري يوم البداية نفسه أو يوماً بعده.';
    if(Object.keys(err).length){said='';rows();$(err.price?'q-price':'q-to').focus();return}
    err=null;q.quote={price:+p,from:x.from,to:x.to,valid:x.valid,note:x.note.trim(),sent:'2026-12-06'};q.s='priced';fresh=q.ref;filter='all';
    said=`<b>أُرسل العرض إلى ${q.who}.</b> السعر مسجَّل على هذا الطلب وحده، ولا يظهر في الموقع العام أبداً.`;
    render();$('said').focus();ttToast(`أُرسل العرض إلى ${q.org}`);
  }
  else if(d.act==='make'){q.mk={from:q.quote.from,to:q.quote.to,cap:String(q.n)};making=true;err=null;rows();$('c-from').focus()}
  else if(d.act==='nomake'){making=false;err=null;rows();document.querySelector('[data-act="make"]').focus()}
  else if(d.act==='save'){
    const m=q.mk,c=m.cap.trim();err={};
    if(!m.from)err.from='اختاري يوم الجلسة الأولى.';
    if(!m.to)err.to='اختاري يوم الجلسة الأخيرة.';else if(m.from&&m.to<m.from)err.to='النهاية قبل البداية. اختاري يوم البداية نفسه أو يوماً بعده.';
    if(!c)err.cap='اكتبي عدد المقاعد.';else if(!(Number.isInteger(+c)&&+c>=1))err.cap='السعة عدد صحيح، مقعد واحد على الأقل.';
    if(Object.keys(err).length){rows();$(err.from?'c-from':err.to?'c-to':'c-cap').focus();return}
    err=null;making=false;q.cohort={from:m.from,to:m.to,cap:+c};fresh=q.ref;
    said=`<b>أُنشئت الدفعة المغلقة.</b> أُرسل إلى ${q.who} رابط دفع واحد بالسعر المتفق عليه، ${money(q.quote.price)}.`;
    render();$('made').focus();ttToast('أُنشئت الدفعة وأُرسل رابط الدفع');
  }
});
render();
</script>
</body>
</html>
